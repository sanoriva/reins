
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm install -g npm@latest

      - run: npm ci

      - name: Set the version from the tag
        run: node scripts/set-version.mjs "${{ github.event.release.tag_name }}"

      - run: npm run build:libs

      - name: Test
        run: |
          npm test -w @reins-ai/contract
          npm test -w @reins-ai/web
          npm test -w @reins-ai/bridge
          npm test -w @reins-ai/voice

      - name: Publish
        env:
          TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: |
          npm publish -w @reins-ai/contract --access public --tag "$TAG"
          npm publish -w @reins-ai/web --access public --tag "$TAG"
          npm publish ./packages/agent-angular/dist --access public --tag "$TAG"
          npm publish -w @reins-ai/bridge --access public --tag "$TAG"
          npm publish -w @reins-ai/voice --access public --tag "$TAG"
