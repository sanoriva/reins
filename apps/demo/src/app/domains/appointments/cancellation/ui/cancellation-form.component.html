<form [formGroup]="form()" (ngSubmit)="submitted.emit()">
  <mat-form-field appearance="outline">
    <mat-label>Cita que quieres anular</mat-label>
    <mat-select formControlName="appointment">
      @for (option of options(); track option) {
        <mat-option [value]="option">{{ option }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
  <button mat-stroked-button type="submit" [disabled]="form().invalid">Anular la cita</button>
</form>
